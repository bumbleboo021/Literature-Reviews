[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dqc-ode"
version = "0.1.0"
description = "From-scratch implementation of Kyriienko, Paine & Elfving (arXiv:2011.10395v2) — Solving nonlinear differential equations with differentiable quantum circuits"
requires-python = ">=3.10"
dependencies = [
    "pennylane>=0.38",
    "torch>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["dqc*", "problems*"]
